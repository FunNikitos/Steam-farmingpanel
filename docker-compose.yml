version: '3.8'

services:
  bot:
    build: .
    container_name: steam-panel-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - /opt/steam-panel/asf-config:/app/asf-config:ro
    networks:
      - steam-network

networks:
  steam-network:
    external: true
    name: steam-panel_default
